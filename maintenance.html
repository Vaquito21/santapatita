  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky: #2596e4;
      --sky-l: #daeefb;
      --yellow: #F7C618;
      --yellow-d: #E0B015;
      --dark: #1A1A2E;
      --dark2: #2d2d44;
      --muted: #6b6b8a;
      --cream: #FFFCF5;
      --blush: #FFB3C6;
      --bg-top: #EAF6FF;
      --bg-bottom: #FFFDF6;
    }

    html, body { height: 100%; }
    body { overflow-x: hidden; overflow-y: auto; }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--dark);
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 65%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* ── Cinta de "en construcción" arriba y abajo ── */
    .tape {
      position: fixed; left: 0; right: 0; height: 16px; z-index: 5;
      background: repeating-linear-gradient(
        -45deg,
        var(--yellow) 0 22px,
        var(--dark) 22px 44px
      );
      background-size: 62px 100%;
      box-shadow: 0 0 0 1px rgba(0,0,0,.05);
    }
    .tape--top { top: 0; animation: tapeScroll 3.4s linear infinite; }
    .tape--bottom { bottom: 0; animation: tapeScroll 3.4s linear infinite reverse; }
    @keyframes tapeScroll { from { background-position-x: 0; } to { background-position-x: 62px; } }

    /* ── Nubes de fondo, quietas y suaves (mismo lenguaje visual del sitio) ── */
    .cloud {
      position: fixed; border-radius: 50%; background: rgba(255,255,255,.7);
      filter: blur(1px); z-index: 0;
    }
    .cloud--1 { width: 220px; height: 220px; top: 8%; left: -60px; animation: drift 22s ease-in-out infinite; }
    .cloud--2 { width: 160px; height: 160px; bottom: 12%; right: -40px; animation: drift 26s ease-in-out infinite reverse; }
    @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(30px); } }

    /* ── Escena principal ── */
    .scene {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 48px 24px; max-width: 560px;
    }

    .mascot-wrap { width: min(260px, 60vw); animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .tail { transform-origin: 172px 150px; animation: wag .7s ease-in-out infinite alternate; }
    @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(14deg); } }

    .paw-tool { transform-origin: 60px 150px; animation: tap 1.9s ease-in-out infinite; animation-delay: .3s; }
    @keyframes tap { 0%,60%,100% { transform: rotate(0deg); } 78% { transform: rotate(-24deg); } }

    .halo { transform-origin: 176px 44px; animation: sway 3.2s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-4deg); } }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--sky-l); color: var(--sky); border: 2px solid rgba(37,150,228,.25);
      font-weight: 800; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase;
      padding: 7px 18px; border-radius: 50px; margin-top: 18px;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-weight: 400;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      color: var(--dark);
      margin: 16px 0 10px;
      line-height: 1.15;
    }

    p.lead {
      font-size: clamp(.95rem, 2.4vw, 1.05rem);
      color: var(--muted);
      font-weight: 700;
      line-height: 1.6;
      max-width: 440px;
    }

    .cta-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 26px; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 50px; font-family: 'Nunito', sans-serif;
      font-weight: 800; font-size: .95rem; text-decoration: none;
      transition: transform .25s cubic-bezier(.4,0,.2,1), box-shadow .25s;
      border: 2px solid transparent;
    }
    .btn:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
    .btn--yellow { background: var(--yellow); color: var(--dark); box-shadow: 0 8px 24px rgba(247,198,24,.35); }
    .btn--yellow:hover { background: var(--yellow-d); transform: translateY(-3px) scale(1.03); }
    .btn--ghost { background: transparent; color: var(--sky); border-color: var(--sky-l); }
    .btn--ghost:hover { border-color: var(--sky); transform: translateY(-3px); }

    .brand-tag {
      margin-top: 34px; font-size: .78rem; font-weight: 800; color: var(--dark);
      display: flex; align-items: center; gap: 6px; opacity: .7;
    }

    /* ── Huellitas caminando ── */
    .trail { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .paw {
      position: absolute; width: 22px; opacity: 0;
      fill: var(--sky);
      animation: pawStep 3.6s ease-in-out infinite;
    }
    .paw--1 { left: 8%;  bottom: 18%; animation-delay: 0s;   transform: rotate(-18deg); }
    .paw--2 { left: 18%; bottom: 30%; animation-delay: .5s;  transform: rotate(-10deg); }
    .paw--3 { left: 28%; bottom: 42%; animation-delay: 1s;   transform: rotate(-4deg);  }
    .paw--4 { right: 28%; bottom: 42%; animation-delay: 1.5s; transform: rotate(4deg) scaleX(-1); }
    .paw--5 { right: 18%; bottom: 30%; animation-delay: 2s;  transform: rotate(10deg) scaleX(-1); }
    .paw--6 { right: 8%;  bottom: 18%; animation-delay: 2.5s; transform: rotate(18deg) scaleX(-1); }
    @keyframes pawStep {
      0% { opacity: 0; transform: translateY(6px) scale(.7) rotate(var(--r, 0deg)); }
      15% { opacity: .55; transform: translateY(0) scale(1) rotate(var(--r, 0deg)); }
      70% { opacity: .55; }
      100% { opacity: 0; }
    }

    @media (max-width: 480px) {
      .trail { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tape--top, .tape--bottom, .cloud--1, .cloud--2, .mascot-wrap, .tail, .paw-tool, .halo, .paw {
        animation: none !important;
      }
      .paw { opacity: .4; }
    }
  </style>
</head>
<body>

  <div class="tape tape--top"></div>
  <div class="tape tape--bottom"></div>
  <div class="cloud cloud--1"></div>
  <div class="cloud cloud--2"></div>

  <div class="trail" aria-hidden="true">
    <svg class="paw paw--1" viewBox="0 0 100 100"><ellipse cx="50" cy="62" rx="26" ry="22"/><ellipse cx="20" cy="30" rx="12" ry="15"/><ellipse cx="45" cy="16" rx="12" ry="15"/><ellipse cx="72" cy="20" rx="11" ry="14"/><ellipse cx="88" cy="42" rx="10" ry="13"/></svg>
    <svg class="paw paw--2" viewBox="0 0 100 100"><ellipse cx="50" cy="62" rx="26" ry="22"/><ellipse cx="20" cy="30" rx="12" ry="15"/><ellipse cx="45" cy="16" rx="12" ry="15"/><ellipse cx="72" cy="20" rx="11" ry="14"/><ellipse cx="88" cy="42" rx="10" ry="13"/></svg>
    <svg class="paw paw--3" viewBox="0 0 100 100"><ellipse cx="50" cy="62" rx="26" ry="22"/><ellipse cx="20" cy="30" rx="12" ry="15"/><ellipse cx="45" cy="16" rx="12" ry="15"/><ellipse cx="72" cy="20" rx="11" ry="14"/><ellipse cx="88" cy="42" rx="10" ry="13"/></svg>
    <svg class="paw paw--4" viewBox="0 0 100 100"><ellipse cx="50" cy="62" rx="26" ry="22"/><ellipse cx="20" cy="30" rx="12" ry="15"/><ellipse cx="45" cy="16" rx="12" ry="15"/><ellipse cx="72" cy="20" rx="11" ry="14"/><ellipse cx="88" cy="42" rx="10" ry="13"/></svg>
    <svg class="paw paw--5" viewBox="0 0 100 100"><ellipse cx="50" cy="62" rx="26" ry="22"/><ellipse cx="20" cy="30" rx="12" ry="15"/><ellipse cx="45" cy="16" rx="12" ry="15"/><ellipse cx="72" cy="20" rx="11" ry="14"/><ellipse cx="88" cy="42" rx="10" ry="13"/></svg>
    <svg class="paw paw--6" viewBox="0 0 100 100"><ellipse cx="50" cy="62" rx="26" ry="22"/><ellipse cx="20" cy="30" rx="12" ry="15"/><ellipse cx="45" cy="16" rx="12" ry="15"/><ellipse cx="72" cy="20" rx="11" ry="14"/><ellipse cx="88" cy="42" rx="10" ry="13"/></svg>
  </div>

  <main class="scene">
    <div class="mascot-wrap">

        <g class="halo">

            <circle cx="4" cy="12" r="9" fill="none" stroke="#2596e4" stroke-width="6"/>
          </g>
        </g>
      </svg>
    </div>

    <span class="eyebrow">🐾 Volvemos pronto</span>
    <h1>¡Nos pusimos el casco un rato!</h1>
    <p class="lead">Estamos mejorando la tienda para que pedir tus gomitas sea aún más fácil. Mientras tanto, escríbenos y coordinamos tu pedido directo.</p>

    <div class="cta-row">
      <a class="btn btn--yellow" href="https://wa.me/51913897717?text=%C2%A1Hola%20Santa%20Patita!%20%F0%9F%90%BE%20Vi%20que%20est%C3%A1n%20en%20mantenimiento%2C%20quiero%20hacer%20un%20pedido." target="_blank" rel="noopener">💬 Pedir por WhatsApp</a>
      <a class="btn btn--ghost" href="https://www.instagram.com/santa.patita/" target="_blank" rel="noopener">📸 @santa.patita</a>

    <div class="brand-tag">🐾 Santa Patita — Suplemento de colágeno natural para perros</div>
  </main>
